[theme]
base = "dark"
primaryColor = "#F5F5F5"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0E1013"
textColor = "#F5F5F5"
linkColor = "#D8D8D8"
borderColor = "#55585D"
# Carregamento nativo da fonte pelos widgets do Streamlit (>= 1.50).
# A declaração mantém alternativas para indisponibilidade do Google Fonts.
font = "'Familjen Grotesk':https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap, sans-serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
