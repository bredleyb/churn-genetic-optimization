[server]
enableStaticServing = true

[[theme.fontFaces]]
family = "Familjen Grotesk"
url = "app/static/FamiljenGrotesk-Variable.ttf"
style = "normal"

[theme]
base = "dark"
primaryColor = "#F5F5F5"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0E1013"
textColor = "#F5F5F5"
linkColor = "#D8D8D8"
borderColor = "#55585D"
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
font = "'Familjen Grotesk', sans-serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
